{% extends 'base.html' %}

{% block title %}Admin Panel{% endblock %}

{% block content %}
<h2>Admin Panel</h2>
<p>Hello, {{ user.get_full_name|default:user.username }}!</p>

<div style="margin-top: 20px; max-width: 400px;">
    <h3>Add a new student</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Student</button>
    </form>
</div>
{% endblock %}
