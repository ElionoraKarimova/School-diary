name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check gradebook core users

      - name: Lint (flake8)
        run: flake8 gradebook core users

      - name: Type-check (mypy)
        env:
          SECRET_KEY: ci-typecheck
          DEBUG: 'True'
        run: mypy gradebook core users --config-file mypy.ini

  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: school_db
          POSTGRES_USER: school_user
          POSTGRES_PASSWORD: school_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: school_db
          POSTGRES_USER: school_user
          POSTGRES_PASSWORD: school_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_TASK_ALWAYS_EAGER: 'True'
        run: pytest -v